services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homelab_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - homelab_network

networks:
  homelab_network:
    name: homelab_network
    external: true
